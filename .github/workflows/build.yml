name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ==========================================
      # VERIFY PROJECT FILES
      # ==========================================

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "=== Current directory ==="
          pwd

          echo "=== Project files ==="
          ls -la

          echo "=== Assets ==="
          find assets -maxdepth 2 -type f -print

          echo "=== Icons ==="
          ls -la assets/icon.png
          ls -la assets/icon.ico

          echo "=== Config ==="
          ls -la config.json

          echo "=== Application ==="
          ls -la run.py


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: python -m pip install -r requirements.txt


      # ==========================================
      # PLAYWRIGHT CHROMIUM
      # ==========================================

      - name: Install Playwright Chromium
        shell: bash
        run: |
          python -m playwright install chromium


      # ==========================================
      # LOCATE PLAYWRIGHT BROWSER
      # ==========================================

      - name: Locate Playwright browser
        shell: bash
        run: |
          echo "=== PLAYWRIGHT_BROWSERS_PATH ==="
          python -c "import playwright; print(playwright.__file__)"

          echo "=== Browser cache ==="

          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ]; then
            find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3 -type d -print || true
          fi

          if [ "$RUNNER_OS" = "Linux" ]; then
            find "$HOME/.cache/ms-playwright" -maxdepth 3 -type d -print || true
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            find "$LOCALAPPDATA/ms-playwright" -maxdepth 3 -type d -print || true
          fi


      # ==========================================
      # CREATE PYINSTALLER SPEC
      # ==========================================

      - name: Create PyInstaller spec
        shell: bash
        run: |
          cat > run.spec <<'EOF'
          from pathlib import Path
          import os
          import sys

          import playwright

          block_cipher = None

          BASE_DIR = Path(SPECPATH)

          PLAYWRIGHT_DRIVER_PATH = (
              Path(playwright.__file__).parent / "driver"
          )

          datas = [
              (
                  str(BASE_DIR / "assets"),
                  "assets",
              ),
              (
                  str(BASE_DIR / "config.json"),
                  ".",
              ),
              (
                  str(PLAYWRIGHT_DRIVER_PATH),
                  "playwright/driver",
              ),
          ]

          # ==========================================
          # PLAYWRIGHT CHROMIUM
          # ==========================================

          if sys.platform == "win32":
              browser_path = (
                  Path(os.environ["LOCALAPPDATA"])
                  / "ms-playwright"
              )

              browser_dirs = list(
                  browser_path.glob("chromium-*")
              )

          else:
              browser_path = (
                  Path.home()
                  / ".cache"
                  / "ms-playwright"
              )

              browser_dirs = list(
                  browser_path.glob("chromium-*")
              )

          for browser_dir in browser_dirs:
              if browser_dir.is_dir():
                  datas.append(
                      (
                          str(browser_dir),
                          "ms-playwright/" + browser_dir.name,
                      )
                  )

          a = Analysis(
              [str(BASE_DIR / "run.py")],
              pathex=[
                  str(BASE_DIR),
              ],
              binaries=[],
              datas=datas,
              hiddenimports=[
                  "playwright.async_api",
                  "playwright.__main__",
                  "qasync",
                  "aiohttp",
                  "bs4",
                  "lxml",
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )

          pyz = PYZ(
              a.pure,
              a.zipped_data,
              cipher=block_cipher,
          )

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,

              name="ComicDownloadTool",

              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,

              console=False,

              icon=(
                  str(BASE_DIR / "assets" / "icon.ico")
                  if sys.platform == "win32"
                  else None
              ),

              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,

              # ==========================================
              # ONEFILE
              # ==========================================

              onefile=True,
          )
          EOF


      # ==========================================
      # PYINSTALLER BUILD
      # ==========================================

      - name: Run PyInstaller build
        run: |
          python -m PyInstaller run.spec --noconfirm --clean


      # ==========================================
      # VERIFY BUILD
      # ==========================================

      - name: Verify build
        shell: bash
        run: |
          set -e

          echo "=== dist ==="
          ls -la dist

          echo "=== Files ==="
          find dist -maxdepth 2 -type f -print | sort


      # ==========================================
      # RENAME WINDOWS EXE
      # ==========================================

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = "dist/ComicDownloadTool.exe"
          $target = "ComicDownloadTool.exe"

          if (!(Test-Path $source)) {
              Write-Error "ComicDownloadTool.exe was not created."
              exit 1
          }

          Copy-Item $source $target -Force

          Write-Host "=== Windows executable ==="
          Get-Item $target


      # ==========================================
      # CREATE APPIMAGE - LINUX ONLY
      # ==========================================

      - name: Download appimagetool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          wget -q \
            https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool


      # ==========================================
      # PREPARE APPIMAGE
      # ==========================================

      - name: Prepare AppImage AppDir
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          APPDIR="ComicDownloadTool.AppDir"

          rm -rf "$APPDIR"

          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # ==========================================
          # COPY PYINSTALLER APPLICATION
          # ==========================================

          cp dist/ComicDownloadTool \
            "$APPDIR/usr/bin/ComicDownloadTool"

          chmod +x \
            "$APPDIR/usr/bin/ComicDownloadTool"

          # ==========================================
          # ICON
          # ==========================================

          ICON_PATH=""

          if [ -f "assets/icon.png" ]; then
              ICON_PATH="assets/icon.png"
          elif [ -f "dist/assets/icon.png" ]; then
              ICON_PATH="dist/assets/icon.png"
          fi

          if [ -z "$ICON_PATH" ]; then
              echo "ERROR: icon.png was not found."
              exit 1
          fi

          cp "$ICON_PATH" \
            "$APPDIR/comicdownloadtool.png"

          cp "$ICON_PATH" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/comicdownloadtool.png"

          # ==========================================
          # DESKTOP ENTRY
          # ==========================================

          cat > "$APPDIR/comicdownloadtool.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ComicDownloadTool
          Comment=Comic Download Tool
          Exec=ComicDownloadTool
          Icon=comicdownloadtool
          Terminal=false
          Categories=Utility;
          EOF

          # ==========================================
          # APPRUN
          # ==========================================

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh

          HERE="$(dirname "$(readlink -f "$0")")"

          exec "$HERE/usr/bin/ComicDownloadTool" "$@"
          EOF

          chmod +x "$APPDIR/AppRun"


      # ==========================================
      # BUILD APPIMAGE
      # ==========================================

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          ./appimagetool \
            ComicDownloadTool.AppDir \
            ComicDownloadTool.AppImage

          chmod +x ComicDownloadTool.AppImage

          echo "=== AppImage ==="
          ls -lh ComicDownloadTool.AppImage


      # ==========================================
      # UPLOAD LINUX APPIMAGE
      # ==========================================

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: ComicDownloadTool.AppImage
          if-no-files-found: error


      # ==========================================
      # UPLOAD WINDOWS EXE
      # ==========================================

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-windows
          path: ComicDownloadTool.exe
          if-no-files-found: error


  # ==========================================
  # PUBLISH RELEASE
  # ==========================================

  release:
    name: Publish release

    if: startsWith(github.ref, 'refs/tags/')

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==========================================
      # DOWNLOAD LINUX APPIMAGE
      # ==========================================

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: release


      # ==========================================
      # DOWNLOAD WINDOWS EXE
      # ==========================================

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloadTool-windows
          path: release


      # ==========================================
      # VERIFY RELEASE FILES
      # ==========================================

      - name: Verify release files
        shell: bash
        run: |
          set -e

          echo "=== Release files ==="
          ls -lh release

          test -f release/ComicDownloadTool.AppImage
          test -f release/ComicDownloadTool.exe


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ComicDownloadTool.AppImage
            release/ComicDownloadTool.exe
          generate_release_notes: true