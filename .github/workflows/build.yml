name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh


      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build.ps1


      # ==========================================
      # VERIFY BUILD
      # ==========================================

      - name: Verify Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          test -f dist/ComicDownloadTool/ComicDownloadTool

          echo "=== Linux build ==="
          ls -lah dist/ComicDownloadTool

          echo "=== Build size ==="
          du -sh dist/ComicDownloadTool


      - name: Verify Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "dist\ComicDownloadTool\ComicDownloadTool.exe")) {
              Write-Error "ComicDownloadTool.exe was not created."
              exit 1
          }

          Write-Host "=== Windows build ==="
          Get-ChildItem "dist\ComicDownloadTool"

          $Size = (
              Get-ChildItem `
                  "dist\ComicDownloadTool" `
                  -Recurse `
                  -File |
              Measure-Object Length -Sum
          ).Sum

          Write-Host "Build size: $([math]::Round($Size / 1MB, 2)) MB"


      # ==========================================
      # CREATE ZIP - LINUX
      # ==========================================

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          cd dist

          zip -r \
            ../ComicDownloadTool-linux.zip \
            ComicDownloadTool

          cd ..

          ls -lh ComicDownloadTool-linux.zip


      # ==========================================
      # CREATE ZIP - WINDOWS
      # ==========================================

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\ComicDownloadTool" `
            -DestinationPath "ComicDownloadTool-windows.zip" `
            -Force

          Get-Item "ComicDownloadTool-windows.zip"


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: ComicDownloadTool-linux.zip
          if-no-files-found: error


      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-windows
          path: ComicDownloadTool-windows.zip
          if-no-files-found: error


  # ==========================================
  # PUBLISH RELEASE
  # ==========================================

  release:
    name: Publish release

    if: startsWith(github.ref, 'refs/tags/')

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==========================================
      # DOWNLOAD LINUX BUILD
      # ==========================================

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: release


      # ==========================================
      # DOWNLOAD WINDOWS BUILD
      # ==========================================

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloadTool-windows
          path: release


      # ==========================================
      # VERIFY RELEASE FILES
      # ==========================================

      - name: Verify release files
        shell: bash
        run: |
          set -e

          echo "=== Release files ==="
          ls -lh release

          test -f release/ComicDownloadTool-linux.zip
          test -f release/ComicDownloadTool-windows.zip


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ComicDownloadTool-linux.zip
            release/ComicDownloadTool-windows.zip
          generate_release_notes: true