name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ==========================================
      # VERIFY PROJECT FILES
      # ==========================================

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "=== Current directory ==="
          pwd

          echo "=== Project files ==="
          ls -la

          echo "=== Assets ==="
          find assets -maxdepth 2 -type f -print

          echo "=== Icons ==="
          ls -la assets/icon.png
          ls -la assets/icon.ico

          echo "=== Config ==="
          ls -la config.json

          echo "=== Application ==="
          ls -la run.py


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: python -m pip install -r requirements.txt


      # ==========================================
      # CREATE PYINSTALLER SPEC
      # ==========================================

      - name: Create PyInstaller spec
        shell: bash
        run: |
          cat > run.spec <<'EOF'
          from pathlib import Path

          import playwright

          block_cipher = None

          # Resolve paths relative to the spec file location
          BASE_DIR = Path(SPECPATH)

          # Locate the actual Playwright driver directory
          PLAYWRIGHT_DRIVER_PATH = Path(playwright.__file__).parent / "driver"

          a = Analysis(
              [str(BASE_DIR / "run.py")],
              pathex=[
                  str(BASE_DIR),
              ],
              binaries=[],
              datas=[
                  # Bundle the entire assets/ directory
                  (
                      str(BASE_DIR / "assets"),
                      "assets",
                  ),

                  # Bundle config.json
                  (
                      str(BASE_DIR / "config.json"),
                      ".",
                  ),

                  # Bundle the Playwright driver
                  (
                      str(PLAYWRIGHT_DRIVER_PATH),
                      "playwright/driver",
                  ),
              ],
              hiddenimports=[
                  "playwright.async_api",
                  "playwright.__main__",
                  "qasync",
                  "aiohttp",
                  "bs4",
                  "lxml",
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )

          pyz = PYZ(
              a.pure,
              a.zipped_data,
              cipher=block_cipher,
          )

          exe = EXE(
              pyz,
              a.scripts,
              [],
              exclude_binaries=True,
              name="ComicDownloadTool",
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              console=False,
              icon=str(BASE_DIR / "assets" / "icon.ico"),
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )

          coll = COLLECT(
              exe,
              a.binaries,
              a.zipfiles,
              a.datas,
              strip=False,
              upx=True,
              upx_exclude=[],
              name="ComicDownloadTool",
          )
          EOF


      # ==========================================
      # PYINSTALLER
      # ==========================================

      - name: Run PyInstaller build
        run: python -m PyInstaller run.spec --noconfirm


      # ==========================================
      # VERIFY PYINSTALLER OUTPUT
      # ==========================================

      - name: Verify PyInstaller output
        shell: bash
        run: |
          set -e

          echo "=== dist ==="
          ls -la dist

          echo "=== ComicDownloadTool ==="
          ls -la dist/ComicDownloadTool

          echo "=== All output files ==="
          find dist/ComicDownloadTool -maxdepth 5 -type f -print | sort

          echo "=== Search for icon files ==="
          find dist/ComicDownloadTool \
            -type f \
            \( -name "icon.png" -o -name "icon.ico" \) \
            -print


      # ==========================================
      # PLAYWRIGHT CHROMIUM - LINUX
      # ==========================================

      - name: Bundle Chromium for Playwright (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: dist/ComicDownloadTool/ms-playwright
        run: |
          python -m playwright install chromium


      # ==========================================
      # PLAYWRIGHT CHROMIUM - WINDOWS
      # ==========================================

      - name: Bundle Chromium for Playwright (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: dist/ComicDownloadTool/ms-playwright
        run: |
          python -m playwright install chromium


      # ==========================================
      # VERIFY FINAL APPLICATION OUTPUT
      # ==========================================

      - name: Verify final application output
        shell: bash
        run: |
          set -e

          echo "=== Application root ==="
          ls -la dist/ComicDownloadTool

          echo "=== Complete file tree ==="
          find dist/ComicDownloadTool -maxdepth 5 -type f -print | sort

          echo "=== Icon search ==="
          find dist/ComicDownloadTool \
            -type f \
            \( -name "icon.png" -o -name "icon.ico" \) \
            -print

          echo "=== Playwright browsers ==="
          ls -la dist/ComicDownloadTool/ms-playwright


      # ==========================================
      # CREATE APPIMAGE - LINUX ONLY
      # ==========================================

      - name: Download appimagetool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          wget -q \
            https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool


      - name: Prepare AppImage AppDir
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          APPDIR="ComicDownloadTool.AppDir"

          rm -rf "$APPDIR"

          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy the complete PyInstaller application
          cp -a dist/ComicDownloadTool/. "$APPDIR/usr/bin/"

          # Locate the bundled application icon
          ICON_PATH=""

          if [ -f "$APPDIR/usr/bin/assets/icon.png" ]; then
            ICON_PATH="$APPDIR/usr/bin/assets/icon.png"
          elif [ -f "$APPDIR/usr/bin/_internal/assets/icon.png" ]; then
            ICON_PATH="$APPDIR/usr/bin/_internal/assets/icon.png"
          fi

          if [ -z "$ICON_PATH" ]; then
            echo "ERROR: icon.png was not found in the PyInstaller output."
            echo "=== Application files ==="
            find "$APPDIR/usr/bin" -type f -print | sort
            exit 1
          fi

          echo "Using icon: $ICON_PATH"

          # AppImage root icon
          cp "$ICON_PATH" \
            "$APPDIR/comicdownloadtool.png"

          # Standard application icon location
          cp "$ICON_PATH" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/comicdownloadtool.png"

          # Desktop entry
          cat > "$APPDIR/comicdownloadtool.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ComicDownloadTool
          Comment=Comic Download Tool
          Exec=ComicDownloadTool
          Icon=comicdownloadtool
          Terminal=false
          Categories=Utility;
          EOF

          # AppRun launcher
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh

          HERE="$(dirname "$(readlink -f "$0")")"

          exec "$HERE/usr/bin/ComicDownloadTool" "$@"
          EOF

          chmod +x "$APPDIR/AppRun"

          echo "=== AppDir ==="
          find "$APPDIR" -maxdepth 6 -type f -print | sort


      # ==========================================
      # BUILD APPIMAGE
      # ==========================================

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          ./appimagetool \
            ComicDownloadTool.AppDir \
            ComicDownloadTool.AppImage

          chmod +x ComicDownloadTool.AppImage

          echo "=== AppImage ==="
          ls -lh ComicDownloadTool.AppImage


      # ==========================================
      # UPLOAD LINUX APPIMAGE
      # ==========================================

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: ComicDownloadTool.AppImage
          if-no-files-found: error


      # ==========================================
      # UPLOAD WINDOWS APPLICATION
      # ==========================================

      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-windows
          path: dist/ComicDownloadTool
          if-no-files-found: error


  # ==========================================
  # PUBLISH RELEASE
  # ==========================================

  release:
    name: Publish release

    if: startsWith(github.ref, 'refs/tags/')

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==========================================
      # DOWNLOAD LINUX APPIMAGE
      # ==========================================

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: release


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ComicDownloadTool.AppImage
          generate_release_notes: true