name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ==========================================
      # VERIFY PROJECT FILES
      # ==========================================

      - name: Verify project files
        shell: bash
        run: |
          echo "=== Working directory ==="
          pwd

          echo "=== Project ==="
          ls -la

          echo "=== Assets ==="
          ls -la assets

          echo "=== Icons ==="
          ls -la assets/icon.png
          ls -la assets/icon.ico

          echo "=== Config ==="
          ls -la config.json

          echo "=== Spec ==="
          ls -la run.spec


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: python -m pip install -r requirements.txt


      # ==========================================
      # PYINSTALLER
      # ==========================================

      - name: Run PyInstaller build
        run: python -m PyInstaller run.spec --noconfirm


      # ==========================================
      # PLAYWRIGHT CHROMIUM
      # ==========================================

      - name: Bundle Chromium for Playwright (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: dist/ComicDownloadTool/ms-playwright
        run: |
          python -m playwright install chromium


      - name: Bundle Chromium for Playwright (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: dist/ComicDownloadTool/ms-playwright
        run: |
          python -m playwright install chromium


      # ==========================================
      # VERIFY PYINSTALLER OUTPUT
      # ==========================================

      - name: Verify PyInstaller output
        shell: bash
        run: |
          echo "=== dist ==="
          ls -la dist

          echo "=== ComicDownloadTool ==="
          ls -la dist/ComicDownloadTool

          echo "=== Assets ==="
          ls -la dist/ComicDownloadTool/assets

          echo "=== Icons ==="
          ls -la dist/ComicDownloadTool/assets/icon.png
          ls -la dist/ComicDownloadTool/assets/icon.ico

          echo "=== Playwright ==="
          ls -la dist/ComicDownloadTool/ms-playwright


      # ==========================================
      # CREATE APPIMAGE - LINUX ONLY
      # ==========================================

      - name: Download appimagetool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool


      - name: Prepare AppImage AppDir
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          APPDIR="ComicDownloadTool.AppDir"

          rm -rf "$APPDIR"

          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy PyInstaller application
          cp -a dist/ComicDownloadTool/. "$APPDIR/usr/bin/"

          # AppImage icon
          cp assets/icon.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/comicdownloadtool.png"

          # AppImage root icon
          cp assets/icon.png \
            "$APPDIR/comicdownloadtool.png"

          # Desktop entry
          cat > "$APPDIR/comicdownloadtool.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ComicDownloadTool
          Comment=Comic Download Tool
          Exec=ComicDownloadTool
          Icon=comicdownloadtool
          Terminal=false
          Categories=Utility;
          EOF

          # AppRun
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh

          HERE="$(dirname "$(readlink -f "$0")")"

          exec "$HERE/usr/bin/ComicDownloadTool" "$@"
          EOF

          chmod +x "$APPDIR/AppRun"

          echo "=== AppDir ==="
          find "$APPDIR" -maxdepth 5 -type f | sort


      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          ./appimagetool \
            ComicDownloadTool.AppDir \
            ComicDownloadTool.AppImage

          chmod +x ComicDownloadTool.AppImage

          ls -lh ComicDownloadTool.AppImage


      # ==========================================
      # UPLOAD LINUX
      # ==========================================

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: ComicDownloadTool.AppImage
          if-no-files-found: error


      # ==========================================
      # UPLOAD WINDOWS
      # ==========================================

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloadTool-windows
          path: dist/ComicDownloadTool
          if-no-files-found: error


  # ==========================================
  # RELEASE
  # ==========================================

  release:
    name: Publish release

    if: startsWith(github.ref, 'refs/tags/')

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==========================================
      # DOWNLOAD LINUX
      # ==========================================

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloadTool-linux
          path: release


      # ==========================================
      # DOWNLOAD WINDOWS
      # ==========================================

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloadTool-windows
          path: release/windows


      # ==========================================
      # ARCHIVE WINDOWS
      # ==========================================

      - name: Archive Windows build
        shell: bash
        run: |
          cd release/windows

          zip -r \
            ../../ComicDownloadTool-windows.zip \
            .


      # ==========================================
      # CHECK RELEASE FILES
      # ==========================================

      - name: Check release files
        shell: bash
        run: |
          echo "=== Linux ==="
          ls -lh release

          echo "=== Windows ==="
          ls -lh ComicDownloadTool-windows.zip


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ComicDownloadTool.AppImage
            ComicDownloadTool-windows.zip
          generate_release_notes: true